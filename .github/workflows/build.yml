name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release (e.g. v1.19.34-ttl.1)"
        required: true
        default: "v1.19.34-ttl.1"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            goamd64: v1
          - arch: arm64
            goamd64: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac
          echo "VERSION=${TAG}" >> "$GITHUB_OUTPUT"
          echo "BUILDTIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Update CA bundle
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Run TTL tests
        if: matrix.arch == 'amd64'
        run: |
          go test -v ./component/dialer -run 'TestDialContextInitialTTL|TestListenPacketInitialTTL'
          go test -tags "with_gvisor" -v ./listener/sing_tun -run 'TestTTL|TestGVisor'

      - name: Build Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOAMD64: ${{ matrix.goamd64 }}
        run: |
          mkdir -p dist/tar
          go build -v -tags "with_gvisor" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${{ steps.ver.outputs.VERSION }}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${{ steps.ver.outputs.BUILDTIME }}' -w -s -buildid=" \
            -o dist/mihomo .
          gzip -9 -c dist/mihomo > "dist/mihomo-linux-${{ matrix.arch }}-${{ steps.ver.outputs.VERSION }}.gz"
          cp dist/mihomo dist/tar/clash
          chmod +x dist/tar/clash
          tar -czf "dist/clash-linux-${{ matrix.arch }}.tar.gz" -C dist/tar clash
          rm -rf dist/mihomo dist/tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-linux-${{ matrix.arch }}
          path: |
            dist/mihomo-linux-${{ matrix.arch }}-${{ steps.ver.outputs.VERSION }}.gz
            dist/clash-linux-${{ matrix.arch }}.tar.gz

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac
          echo "TAG_NAME=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum *.gz *.tar.gz > sha256sums.txt
          cat sha256sums.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG_NAME }}
          name: mihomo ${{ steps.ver.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
