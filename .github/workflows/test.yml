name: Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Test with tag with_gvisor
        run: go test ./... -count=1 -tags "with_gvisor"
